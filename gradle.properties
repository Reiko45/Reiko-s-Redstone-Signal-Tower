# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.265
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Parchment gives readable parameter names in Minecraft code
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Mod properties
mod_id=reikos_signal_tower
mod_name=Reiko's Redstone Signal Tower
mod_license=All Rights Reserved
mod_version=0.50.0
mod_group_id=com.reiko.signaltower
mod_authors=Reiko
mod_description=Build radio towers that send redstone signals wirelessly. The higher a Radio Transmitter sits, the farther it reaches. Tune transmitters and receivers to any of nearly a billion frequencies with the Frequency Tuner.

# Optional integrations (compile against, not bundled)
jade_version=15.10.6+neoforge
