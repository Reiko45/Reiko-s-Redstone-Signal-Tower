plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    // Modrinth's maven, only for the optional Jade integration.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
    // v0.61.0: JourneyMap's API (the full JourneyMap jar only carries it nested inside).
    exclusiveContent {
        forRepository {
            maven {
                name = 'JourneyMap'
                url = 'https://jm.gserv.me/repository/maven-public/'
            }
        }
        filter { includeGroup 'info.journeymap' }
    }
}

// Dependencies that are only on the classpath of the dev runs (client, server, game tests),
// never required by the built mod.
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Jade is optional: the tooltip plugin in compat/jade is compiled against it and only loaded by
    // Jade itself, so the mod works the same without it. Jade is in the dev runs for testing;
    // run with -PnoJade (for example ./gradlew runGameTestServer -PnoJade) to leave it out.
    compileOnly "maven.modrinth:jade:${jade_version}"
    if (!project.hasProperty('noJade')) {
        localRuntime "maven.modrinth:jade:${jade_version}"
    }
    // Reiko's Weather (v0.53.0) is optional too, and read through reflection (compat/ReikosWeatherCompat),
    // so nothing is compiled against it. To try the two together, build its jar and pass its path:
    // ./gradlew runGameTestServer -PwithWeather=/path/to/reikos_weather-1.7.0.jar
    if (project.hasProperty('withWeather')) {
        localRuntime files(project.property('withWeather'))
    }
    // JEI and EMI (v0.57.0) are optional recipe viewers: compat/jei and compat/emi are compiled against
    // them and only loaded by them. Add one to a dev run with -PwithJei or -PwithEmi. (jei_version is a Modrinth
    // version id: JEI's version number alone picks its Forge jar.)
    compileOnly "maven.modrinth:jei:${jei_version}"
    compileOnly "maven.modrinth:emi:${emi_version}"
    if (project.hasProperty('withJei')) {
        localRuntime "maven.modrinth:jei:${jei_version}"
    }
    if (project.hasProperty('withEmi')) {
        localRuntime "maven.modrinth:emi:${emi_version}"
    }
    // CC: Tweaked (v0.58.0) is optional too: compat/cct registers the peripherals only when it's loaded.
    // Add it to a dev run with -PwithCct. (cct_version is a Modrinth version id, the NeoForge 1.21.1 jar.)
    compileOnly "maven.modrinth:cc-tweaked:${cct_version}"
    if (project.hasProperty('withCct')) {
        localRuntime "maven.modrinth:cc-tweaked:${cct_version}"
    }
    // JourneyMap and Xaero's Minimap (v0.61.0) are optional maps: compat/map adds waypoints (and, in
    // JourneyMap, reach circles) through them. Add one to a dev run with -PwithJourneyMap or -PwithXaero.
    // (Both versions are Modrinth version ids, the NeoForge 1.21.1 jars.)
    compileOnly("info.journeymap:journeymap-api-neoforge:${journeymap_api_version}") { transitive = false }
    compileOnly "maven.modrinth:xaeros-minimap:${xaero_version}"
    if (project.hasProperty('withJourneyMap')) {
        localRuntime "maven.modrinth:journeymap:${journeymap_version}"
    }
    if (project.hasProperty('withXaero')) {
        localRuntime "maven.modrinth:xaeros-minimap:${xaero_version}"
    }
    // WTHIT (v0.63.0) is optional: compat/wthit is compiled against it and only loaded by WTHIT itself
    // (through waila_plugins.json). Add it (with Bad Packets, which it needs) to a dev run with -PwithWthit;
    // add -PnoJade too to see WTHIT's tooltip alone.
    compileOnly "maven.modrinth:wthit:${wthit_version}"
    if (project.hasProperty('withWthit')) {
        localRuntime "maven.modrinth:wthit:${wthit_version}"
        localRuntime "maven.modrinth:badpackets:${badpackets_version}"
    }
}

base {
    archivesName = 'reikos_wireless_redstone' // v0.68.1: the mod's new name (its mod id stays reikos_signal_tower)
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Runs the automated in-game tests in src/main/java/.../gametest and exits.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Fills in neoforge.mods.toml from the values in gradle.properties
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
