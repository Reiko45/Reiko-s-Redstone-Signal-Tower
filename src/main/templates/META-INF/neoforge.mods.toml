modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

# Optional: Jade shows radio blocks' frequency, signal and reach. Only checked if Jade is installed.
[[dependencies.${mod_id}]]
    modId = "jade"
    type = "optional"
    versionRange = "[15.0,)"
    ordering = "NONE"
    side = "BOTH"

# Optional (v0.58.0): CC: Tweaked computers can use radio transmitters, receivers and telegraphs as
# peripherals. 1.114.0 is the first 1.21.1 release with the API this uses.
[[dependencies.${mod_id}]]
    modId = "computercraft"
    type = "optional"
    versionRange = "[1.114.0,)"
    ordering = "NONE"
    side = "BOTH"
